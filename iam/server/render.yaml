services:
  - type: web
    name: iam-proxy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server_online:app
    envVars:
      - key: FREETHEAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
